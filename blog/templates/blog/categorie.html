<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catégorie : {{ categorie.nom }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Mon Blog CMS</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4">Articles dans la catégorie : <span class="text-primary">{{ categorie.nom }}</span></h1>
        <div class="row">
            {% for article in articles %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">{{ article.titre }}</h5>
                            <p class="text-muted small">Par {{ article.auteur.username }}</p>
                            <a href="{% url 'blog:detail_article' article.slug %}" class="btn btn-primary btn-sm">Lire la suite</a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <p>Aucun article dans cette catégorie.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
