<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un compte | Mon Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Thème sombre professionnel */
        body { 
            background-color: #0f172a; /* Bleu nuit profond */
            color: #e2e8f0; /* Texte gris clair */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-inscription { 
            background-color: #1e293b; /* Carte plus claire */
            border: 1px solid #334155;
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        .form-control { 
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px; 
            padding: 12px; 
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #fff;
            border-color: #38bdf8; /* Bleu clair au clic */
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .btn-custom { 
            border-radius: 8px; 
            padding: 12px; 
            font-weight: bold; 
            background-color: #38bdf8; 
            color: #0f172a;
            border: none; 
            transition: 0.3s;
        }
        .btn-custom:hover { 
            background-color: #0ea5e9; 
            color: #0f172a;
        }
        label { color: #94a3b8; font-weight: 500; }
        a { color: #38bdf8; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .text-muted { color: #94a3b8 !important; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-inscription">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-white">Créer un compte</h2>
                            <p class="text-muted">Rejoignez la communauté Mon Blog CMS</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            
                            {% for field in form %}
                                <div class="mb-3">
                                    <label for="{{ field.id_for_label }}" class="form-label">
                                        {{ field.label }}
                                    </label>
                                    <input type="{{ field.field.widget.input_type }}" 
                                           name="{{ field.html_name }}" 
                                           id="{{ field.id_for_label }}" 
                                           class="form-control" 
                                           {% if field.field.required %}required{% endif %}>
                                    
                                    {% if field.help_text %}
                                        <div class="form-text text-muted" style="font-size: 0.75rem;">
                                            {{ field.help_text|safe }}
                                        </div>
                                    {% endif %}
                                    
                                    {% if field.errors %}
                                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                                    {% endif %}
                                </div>
                            {% endfor %}

                            <button type="submit" class="btn btn-custom w-100 mt-4">S'inscrire</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted">Déjà un compte ? <a href="{% url 'accounts:login' %}">Se connecter</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
